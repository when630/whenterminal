<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>WHENTERMINAL</title>
  <link rel="stylesheet" href="../libs/css/uspi.css">
  <style>.note { color: #9a9a9a; font-size: 12px; line-height: 1.5; padding: 4px 0 0; }</style>
</head>
<body>
  <div class="uspi-wrapper hidden">
    <form id="property-inspector">
      <div class="uspi-item">
        <div class="uspi-item-label">한도</div>
        <select class="uspi-item-value select" name="pick" id="pick">
          <option value="">자동 (놓은 순서)</option>
          <option value="summary">요약 (5시간 + 주간)</option>
          <option value="five_hour">5시간</option>
          <option value="seven_day">주간</option>
          <option value="model">모델별 주간</option>
        </select>
      </div>
    </form>
    <div class="note">한도를 고르면 이 키는 그 한도만 보여 줘요. 자동이면 사용량 키가 하나일 때 요약, 여럿이면 놓은 순서대로 5시간 → 주간 → 모델별 주간이에요. 요약은 WHENTERMINAL이 받아 둔 구독 사용량(5시간·주간)과 5시간 창이 초기화되는 시각을 보여 줘요. 80%를 넘으면 빨강이에요. 아래 오른쪽은 실행 중(▶)·확인 대기(!) 대화 수예요. 누르면 사용량을 새로 받아요.</div>
  </div>
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
  <script>
    const sel = document.getElementById('pick')
    const load = (jsn) => { if (jsn && jsn.param && jsn.param.pick !== undefined) sel.value = String(jsn.param.pick) }
    $UD.connect()
    $UD.onConnected(() => {
      document.querySelector('.uspi-wrapper').classList.remove('hidden')
      sel.addEventListener('change', () => $UD.sendParamFromPlugin({ pick: sel.value }))
    })
    $UD.onAdd(load)
    $UD.onParamFromApp(load)
  </script>
</body>
</html>
